name: Auto Unzip
on:
  push:
    paths:
      - '**.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          unzip -o "*.zip"
          rm -f *.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Unzip uploaded files" || exit 0
          git push
